# Builds a signed APK and publishes it as a GitHub release. Any of these starts a release:
# - Pushing a version tag: git tag v1.2.0 && git push origin v1.2.0
# - Publishing a release on the website with a new vX.Y.Z tag: creating the tag starts this workflow, and the APK
#   is attached to that release.
# - Pushing to main (e.g. merging a pull request) with a commit message line "Release: 1.2.0". The pushed commit is
#   tagged v1.2.0. This is how a Claude Code cloud session releases: it can merge but not push tags.
# - Running it by hand: Actions → Release → Run workflow, with a version.
# Installed apps check the latest release on start and offer to install it (see data/Updater.kt).
#
# Required repository secrets (the same key must sign every release, or phones refuse the update):
#   KEYSTORE_BASE64    base64 of the .keystore file
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.9.0. The selected branch is tagged v1.9.0.'
        required: true

permissions:
  contents: write

jobs:
  # Works out the version to release; empty for a push to main that doesn't ask for one.
  version:
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, 'Release:')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(printf '%s\n' "$COMMIT_MESSAGE" | sed -n 's/^Release: *v\{0,1\}\([0-9][0-9.]*\) *$/\1/p' | head -n 1)
            if [ -z "$version" ]; then
              echo "::notice::No \"Release: X.Y.Z\" line in the commit message, nothing to release."
              exit 0
            fi
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No version like 1.9.0 to release (got '$version')."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Releases must be signed with the same key as installed apps."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        env:
          TOOHEAVY_KEYSTORE: ${{ runner.temp }}/release.keystore
          TOOHEAVY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOOHEAVY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOOHEAVY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PappVersion="$VERSION"

      # A release published on the website already exists (publishing it created the tag): attach the APK.
      # Otherwise create it, which also creates the tag on the built commit if it's missing. Tags made with the
      # workflow token don't start workflows, so this doesn't run twice.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="TooHeavy-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --title "TooHeavy $TAG" --generate-notes
          fi
