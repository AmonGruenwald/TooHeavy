# Builds a signed APK and publishes it as a GitHub release whenever a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Installed apps check the latest release on start and offer to install it (see data/Updater.kt).
#
# Required repository secrets (the same key must sign every release, or phones refuse the update):
#   KEYSTORE_BASE64    base64 of the .keystore file
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Releases must be signed with the same key as installed apps."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        env:
          TOOHEAVY_KEYSTORE: ${{ runner.temp }}/release.keystore
          TOOHEAVY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOOHEAVY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOOHEAVY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="TooHeavy-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "TooHeavy $GITHUB_REF_NAME" --generate-notes
