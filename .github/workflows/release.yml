# Builds a signed APK and publishes it as a GitHub release whenever a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Publishing a release on the website with a new vX.Y.Z tag works too: creating the tag starts this
# workflow, and the APK is attached to that release.
# Without tag rights (e.g. from a Claude cloud session), run it by hand with a version: Actions →
# Release → Run workflow on main. It tags that commit vX.Y.Z and publishes the release.
# Installed apps check the latest release on start and offer to install it (see data/Updater.kt).
#
# Required repository secrets (the same key must sign every release, or phones refuse the update):
#   KEYSTORE_BASE64    base64 of the .keystore file
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.9.0. The selected branch is tagged v1.9.0.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must look like 1.9.0, got '$INPUT_VERSION'."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::Tag v$version already exists."
              exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Releases must be signed with the same key as installed apps."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        env:
          TOOHEAVY_KEYSTORE: ${{ runner.temp }}/release.keystore
          TOOHEAVY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOOHEAVY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOOHEAVY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PappVersion="$VERSION"

      # A release published on the website already exists (publishing it created the tag): attach the APK.
      # Otherwise create it; on a manual run that also creates the tag on the built commit. Tags made with
      # the workflow token don't start workflows, so this doesn't run twice.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="TooHeavy-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --title "TooHeavy $TAG" --generate-notes
          fi
